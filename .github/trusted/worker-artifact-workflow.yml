name: Website CI and Worker Artifact

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  repo-check:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.0
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Astro and TypeScript checks
        run: pnpm check

      - name: Type-check tests and smoke scripts
        run: pnpm check:tests

      - name: Check surface coverage
        run: pnpm check:surface

      - name: Check image alt-text coverage
        run: pnpm check:alt

      - name: Run Biome lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Build site
        run: pnpm build

      - name: Stamp exact release marker
        shell: bash
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          release_marker="worker-release-marker:$SOURCE_COMMIT:$RUN_ID:$RUN_ATTEMPT"
          printf '\n<!-- %s -->\n' "$release_marker" >> dist/client/index.html
          grep -Fq -- "$release_marker" dist/client/index.html

      - name: Smoke test built site output
        run: pnpm smoke:dist

      - name: Check production-format Worker runtime
        run: pnpm check:worker

      # The headless shell is roughly half the download of full Chromium. Note that
      # `playwright` is deliberately NOT in pnpm.onlyBuiltDependencies, so the
      # browser is fetched only here rather than on every pnpm install.
      - name: Install Chromium for island hydration check
        run: pnpm exec playwright install --with-deps chromium-headless-shell

      # This runs last so failures in cheaper checks stop before the browser work.
      - name: Check island hydration
        run: pnpm check:islands

      - name: Package the validated Worker artifact
        shell: bash
        env:
          BUILD_COMMIT: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          jq -e '
            (keys | sort) == ["auxiliaryWorkers", "configPath", "prerenderWorkerConfigPath"] and
            .configPath == "../../dist/server/wrangler.json" and
            .auxiliaryWorkers == []
          ' .wrangler/deploy/config.json > /dev/null
          jq -e '
            .name == "zenml-io-v2-worker" and
            .main == "entry.mjs" and
            .compatibility_date == "2026-02-10" and
            .compatibility_flags == ["nodejs_compat"] and
            .workers_dev == false and
            .preview_urls == false and
            .no_bundle == true and
            .assets.directory == "../client" and
            .assets.binding == "ASSETS" and
            .assets.html_handling == "drop-trailing-slash" and
            .assets.not_found_handling == "404-page" and
            .assets.run_worker_first == ["/api/*"] and
            (.route == null) and
            (.routes == null) and
            (.build == null) and
            (.durable_objects.bindings // [] | length) == 0 and
            (.kv_namespaces // [] | length) == 0 and
            (.d1_databases // [] | length) == 0 and
            (.r2_buckets // [] | length) == 0 and
            (.services // [] | length) == 0
          ' dist/server/wrangler.json > /dev/null
          test -f dist/server/entry.mjs
          test -f dist/client/index.html
          release_marker="worker-release-marker:$SOURCE_COMMIT:$RUN_ID:$RUN_ATTEMPT"
          grep -Fq -- "$release_marker" dist/client/index.html

          replay_dir="$(mktemp -d)"
          trap 'rm -rf "$replay_dir"' EXIT
          mkdir -p "$replay_dir/.wrangler/deploy"
          cp -R dist "$replay_dir/dist"
          cp .wrangler/deploy/config.json "$replay_dir/.wrangler/deploy/config.json"
          pnpm exec wrangler versions upload \
            --dry-run \
            --cwd "$replay_dir" \
            --outdir "$replay_dir/dry-run"

          tar -czf worker-dist.tar.gz dist .wrangler/deploy/config.json
          sha256sum worker-dist.tar.gz > worker-dist.sha256
          generated_config_sha256="$(
            sha256sum dist/server/wrangler.json | cut -d ' ' -f 1
          )"
          deploy_config_sha256="$(
            sha256sum .wrangler/deploy/config.json | cut -d ' ' -f 1
          )"
          jq -n \
            --arg artifact_sha256 "$(cut -d ' ' -f 1 worker-dist.sha256)" \
            --arg artifact_contract "astro-cloudflare-v6" \
            --arg build_commit "$BUILD_COMMIT" \
            --arg deploy_config_sha256 "$deploy_config_sha256" \
            --arg event_name "$EVENT_NAME" \
            --arg generated_config_sha256 "$generated_config_sha256" \
            --arg lockfile_sha256 "$(sha256sum pnpm-lock.yaml | cut -d ' ' -f 1)" \
            --argjson production_release_eligible true \
            --arg run_attempt "$RUN_ATTEMPT" \
            --arg run_id "$RUN_ID" \
            --arg source_branch "$SOURCE_BRANCH" \
            --arg source_commit "$SOURCE_COMMIT" \
            --slurpfile config wrangler.jsonc \
            '{
              artifact_sha256: $artifact_sha256,
              artifact_contract: $artifact_contract,
              build_commit: $build_commit,
              compatibility_date: $config[0].compatibility_date,
              compatibility_flags: $config[0].compatibility_flags,
              deploy_config_sha256: $deploy_config_sha256,
              event_name: $event_name,
              generated_config_sha256: $generated_config_sha256,
              lockfile_sha256: $lockfile_sha256,
              production_release_eligible: $production_release_eligible,
              required_secrets: $config[0].secrets.required,
              run_attempt: $run_attempt,
              run_id: $run_id,
              source_branch: $source_branch,
              source_commit: $source_commit
            }' > worker-manifest.json

      - name: Publish the validated Worker artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-dist
          path: |
            worker-dist.tar.gz
            worker-dist.sha256
            worker-manifest.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
