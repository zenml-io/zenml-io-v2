name: Upload Worker PR Preview

on:
  workflow_run:
    workflows: ["Website CI and Worker Artifact"]
    types: [completed]

concurrency:
  group: worker-preview-pr-${{ github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: true

jobs:
  upload-preview:
    name: Upload inactive Worker preview
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login != 'dependabot[bot]' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    environment: worker-preview
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Download the triggering run artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: worker-dist
          path: candidate
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify artifact provenance and checksum
        shell: bash
        env:
          EXPECTED_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          cd candidate
          sha256sum --check worker-dist.sha256
          jq -e \
            --arg artifact_sha256 "$(cut -d ' ' -f 1 worker-dist.sha256)" \
            --arg branch "$EXPECTED_BRANCH" \
            --arg commit "$EXPECTED_COMMIT" \
            --arg run_id "$EXPECTED_RUN_ID" \
            '.event_name == "pull_request" and
             .artifact_sha256 == $artifact_sha256 and
             .source_branch == $branch and
             .source_commit == $commit and
             .run_id == $run_id' \
            worker-manifest.json > /dev/null

      - name: Check that the artifact is still the current PR head
        id: current-pr-head
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          current_commit="$(
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha
          )"
          if [ "$current_commit" = "$EXPECTED_COMMIT" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale preview artifact for $EXPECTED_COMMIT."
          fi

      - name: Reject unsafe Worker artifact
        if: steps.current-pr-head.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          if tar -tzf worker-dist.tar.gz | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "Worker archive contains an unsafe path." >&2
            exit 1
          fi
          while read -r mode _; do
            case "${mode:0:1}" in
              -|d) ;;
              *)
                echo "Worker archive contains a link or special file." >&2
                exit 1
                ;;
            esac
          done < <(tar -tvzf worker-dist.tar.gz)
          jq -e '
            ((keys - [
              "$schema", "assets", "compatibility_date",
              "compatibility_flags", "main", "name", "preview_urls",
              "secrets", "workers_dev"
            ]) | length == 0) and
            .main == "dist/_worker.js/index.js" and
            .workers_dev == false and
            .assets.directory == "./dist" and
            .assets.binding == "ASSETS" and
            (.route == null) and
            (.routes == null) and
            (.build == null)
          ' wrangler.jsonc > /dev/null

      - name: Prepare trusted preview configuration
        if: steps.current-pr-head.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          mkdir dist
          tar -C dist -xzf worker-dist.tar.gz
          jq '
            .name = "zenml-io-v2-worker-preview" |
            .preview_urls = true |
            del(.secrets)
          ' wrangler.jsonc > upload-wrangler.json

      - name: Install pinned Wrangler
        if: steps.current-pr-head.outputs.current == 'true'
        run: npm install --global wrangler@4.110.0

      - name: Upload inactive preview version
        if: steps.current-pr-head.outputs.current == 'true'
        id: upload
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_PREVIEW_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          SEGMENT_FORMS_WRITE_KEY: ${{ secrets.WORKERS_PREVIEW_SEGMENT_FORMS_WRITE_KEY }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          TURNSTILE_SECRET_KEY: ${{ secrets.WORKERS_PREVIEW_TURNSTILE_SECRET_KEY }}
        run: |
          set -euo pipefail
          cd candidate
          secrets_file="$RUNNER_TEMP/worker-preview-secrets.env"
          output_file="$RUNNER_TEMP/wrangler-preview-output.jsonl"
          trap 'rm -f "$secrets_file"' EXIT
          {
            printf 'SEGMENT_FORMS_WRITE_KEY=%s\n' "$SEGMENT_FORMS_WRITE_KEY"
            printf 'TURNSTILE_SECRET_KEY=%s\n' "$TURNSTILE_SECRET_KEY"
          } > "$secrets_file"
          chmod 600 "$secrets_file"
          export WRANGLER_OUTPUT_FILE_PATH="$output_file"
          artifact_sha256="$(jq -r .artifact_sha256 worker-manifest.json)"
          version_message="source_commit=$SOURCE_COMMIT source_branch=$SOURCE_BRANCH source_run_id=$SOURCE_RUN_ID artifact_sha256=$artifact_sha256"
          wrangler versions upload \
            --config upload-wrangler.json \
            --secrets-file "$secrets_file" \
            --preview-alias "pr-$PR_NUMBER" \
            --tag pr-preview \
            --message "$version_message"
          jq -s 'map(select(.type == "version-upload")) | last' \
            "$output_file" > upload-result.json
          version_id="$(jq -er .version_id upload-result.json)"
          preview_url="$(jq -er '.preview_alias_url // .preview_url' upload-result.json)"
          wrangler versions view "$version_id" \
            --name zenml-io-v2-worker-preview \
            --json > version-metadata.json
          jq -e '
            [.resources.bindings[]? |
              select(.type == "secret_text") | .name] as $names |
            ($names | index("TURNSTILE_SECRET_KEY") != null) and
            ($names | index("SEGMENT_FORMS_WRITE_KEY") != null)
          ' version-metadata.json > /dev/null
          {
            echo "version_id=$version_id"
            echo "preview_url=$preview_url"
            echo "artifact_sha256=$(jq -r .artifact_sha256 worker-manifest.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Record preview metadata
        if: steps.current-pr-head.outputs.current == 'true'
        shell: bash
        env:
          ARTIFACT_SHA256: ${{ steps.upload.outputs.artifact_sha256 }}
          PREVIEW_URL: ${{ steps.upload.outputs.preview_url }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
        run: |
          {
            echo "## Inactive Worker preview"
            echo
            printf -- "- Version: \`%s\`\n" "$VERSION_ID"
            printf -- "- Preview: %s\n" "$PREVIEW_URL"
            printf -- "- Source commit: \`%s\`\n" "$SOURCE_COMMIT"
            printf -- "- Source branch: \`%s\`\n" "$SOURCE_BRANCH"
            printf -- "- CI run: \`%s\`\n" "$SOURCE_RUN_ID"
            printf -- "- Artifact SHA-256: \`%s\`\n" "$ARTIFACT_SHA256"
            echo
            echo "This version is isolated on the preview Worker and is not active."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview metadata on PR
        if: steps.current-pr-head.outputs.current == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          number: ${{ github.event.workflow_run.pull_requests[0].number }}
          header: cloudflare-worker-preview
          message: |
            ## Cloudflare Worker Preview

            | | |
            |---|---|
            | **Preview URL** | ${{ steps.upload.outputs.preview_url }} |
            | **Inactive version** | `${{ steps.upload.outputs.version_id }}` |
            | **Source branch** | `${{ github.event.workflow_run.head_branch }}` |
            | **Source commit** | `${{ github.event.workflow_run.head_sha }}` |
            | **CI run** | `${{ github.event.workflow_run.id }}` |

            This isolated preview version is not deployed to production.
