name: Activate Exact Worker Version

on:
  workflow_dispatch:
    inputs:
      version_id:
        description: Exact inactive zenml-io-v2-worker version ID
        required: true
        type: string
      source_commit:
        description: Source commit recorded on that version
        required: true
        type: string
      source_branch:
        description: Source branch recorded on that version
        required: true
        type: string
      source_run_id:
        description: CI run ID recorded on that version
        required: true
        type: string
      artifact_sha256:
        description: Artifact SHA-256 recorded on that version
        required: true
        type: string
      self_reviewed:
        description: I reviewed the exact version and activation metadata
        required: true
        type: boolean

concurrency:
  group: zenml-io-worker-production
  cancel-in-progress: false

jobs:
  activate:
    name: Activate exact production version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Require explicit self-review
        if: inputs.self_reviewed != true
        run: |
          echo "The exact Worker version and provenance must be self-reviewed." >&2
          exit 1

      - name: Validate activation identifiers
        shell: bash
        env:
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          VERSION_ID: ${{ inputs.version_id }}
        run: |
          set -euo pipefail
          [[ "$VERSION_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]

      - name: Install pinned Wrangler
        run: npm install --global wrangler@4.110.0

      - name: Inspect exact version
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_PRODUCTION_TOKEN }}
          VERSION_ID: ${{ inputs.version_id }}
        run: |
          set -euo pipefail
          wrangler versions view "$VERSION_ID" \
            --name zenml-io-v2-worker \
            --json > version-metadata.json

      - name: Verify required secret bindings
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            [.resources.bindings[]? |
              select(.type == "secret_text") | .name] as $names |
            ($names | index("TURNSTILE_SECRET_KEY") != null) and
            ($names | index("SEGMENT_FORMS_WRITE_KEY") != null)
          ' version-metadata.json > /dev/null

      - name: Verify exact version provenance
        shell: bash
        env:
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          message="$(jq -er '.annotations["workers/message"]' version-metadata.json)"
          grep -Fq -- " source_commit=$SOURCE_COMMIT " <<< " $message " ||
            { echo "Version source commit does not match." >&2; exit 1; }
          grep -Fq -- " source_branch=$SOURCE_BRANCH " <<< " $message " ||
            { echo "Version source branch does not match." >&2; exit 1; }
          grep -Fq -- " source_run_id=$SOURCE_RUN_ID " <<< " $message " ||
            { echo "Version CI run does not match." >&2; exit 1; }
          grep -Fq -- " artifact_sha256=$ARTIFACT_SHA256 " <<< " $message " ||
            { echo "Version artifact digest does not match." >&2; exit 1; }

      - name: Record activation inputs
        shell: bash
        env:
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          INITIATOR: ${{ github.actor }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          VERSION_ID: ${{ inputs.version_id }}
        run: |
          {
            echo "## Production Worker activation"
            echo
            printf -- "- Candidate version: \`%s\`\n" "$VERSION_ID"
            printf -- "- Source commit: \`%s\`\n" "$SOURCE_COMMIT"
            printf -- "- Source branch: \`%s\`\n" "$SOURCE_BRANCH"
            printf -- "- CI run: \`%s\`\n" "$SOURCE_RUN_ID"
            printf -- "- Artifact SHA-256: \`%s\`\n" "$ARTIFACT_SHA256"
            printf -- "- Initiator/self-reviewer: \`%s\`\n" "$INITIATOR"
            echo
            echo "The pre-activation deployment state is attached to this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture pre-activation deployment
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_PRODUCTION_TOKEN }}
        run: |
          set -euo pipefail
          wrangler deployments list \
            --name zenml-io-v2-worker \
            --json > previous-deployments.json

      - name: Preserve pre-activation deployment metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pre-activation-deployment-${{ inputs.version_id }}
          path: |
            previous-deployments.json
            version-metadata.json
          if-no-files-found: error
          retention-days: 30

      - name: Activate exact Worker version
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_PRODUCTION_TOKEN }}
          VERSION_ID: ${{ inputs.version_id }}
        run: |
          set -euo pipefail
          wrangler versions deploy "$VERSION_ID@100%" \
            --name zenml-io-v2-worker \
            --yes
