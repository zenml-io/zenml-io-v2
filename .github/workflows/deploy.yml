name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  repo-check:
    name: Repo checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Astro and TypeScript checks
        run: pnpm check

      - name: Check image alt-text coverage
        run: pnpm check:alt

      - name: Run Biome lint
        run: pnpm lint

      - name: Build site
        run: pnpm build

  deploy:
    name: Cloudflare Pages deploy
    runs-on: ubuntu-latest
    needs: repo-check
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Check Cloudflare credentials
        id: cloudflare-credentials
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are not available; skipping PR preview deployment."
          else
            echo "Cloudflare credentials are required for production deployment." >&2
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.cloudflare-credentials.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name zenml-io-v2 --branch ${{ github.head_ref || github.ref_name }} --commit-dirty=true

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.cloudflare-credentials.outputs.available == 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: cloudflare-preview
          message: |
            ## Cloudflare Pages Preview

            | | |
            |---|---|
            | **Preview URL** | ${{ steps.deploy.outputs.deployment-url }} |
            | **Branch** | `${{ github.head_ref }}` |
            | **Commit** | `${{ github.sha }}` |
