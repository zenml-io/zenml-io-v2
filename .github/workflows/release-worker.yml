name: Release Worker to Production

on:
  workflow_run:
    workflows: ["Website CI and Worker Artifact"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: >-
    ${{
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_sha == github.sha &&
      'zenml-io-worker-production' ||
      format('zenml-io-worker-ineligible-{0}', github.run_id)
    }}
  cancel-in-progress: false

env:
  ACCEPTED_WORKER_ROUTES_JSON: '["www.zenml.io/*"]'
  WORKER_NAME: zenml-io-v2-worker

jobs:
  eligibility:
    name: Verify current main release eligibility
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.verify.outputs.eligible }}
    steps:
      - name: Download validated Worker artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: worker-dist
          path: eligibility-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify exact successful current-main run
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          echo "eligible=false" >> "$GITHUB_OUTPUT"

          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
            > source-run.json
          jq -e \
            --arg commit "$SOURCE_COMMIT" \
            --arg repository "$GITHUB_REPOSITORY" \
            '.name == "Website CI and Worker Artifact" and
             .path == ".github/workflows/deploy.yml" and
             .conclusion == "success" and
             .event == "push" and
             .head_branch == "main" and
             .head_repository.full_name == $repository and
             .head_sha == $commit' \
            source-run.json > /dev/null

          if ! jq -e '.production_release_eligible == true' \
            eligibility-artifact/worker-manifest.json > /dev/null; then
            {
              echo "## Production Worker release paused"
              echo
              echo "This artifact is explicitly marked ineligible for automatic"
              echo "production activation. Complete the reviewed preview and"
              echo "staging acceptance before changing that manifest gate."
              printf -- "- Commit: \`%s\`\n" "$SOURCE_COMMIT"
              printf -- "- CI run: \`%s\`\n" "$SOURCE_RUN_ID"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          live_main_commit="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha
          )"
          if [ "$live_main_commit" != "$SOURCE_COMMIT" ]; then
            {
              echo "## Production Worker release skipped"
              echo
              echo "A newer main commit exists. Its CI run contains this commit"
              echo "and will produce the release candidate instead."
              echo
              printf -- "- Skipped commit: \`%s\`\n" "$SOURCE_COMMIT"
              printf -- "- Current main: \`%s\`\n" "$live_main_commit"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"

  upload:
    name: Upload inactive production version
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    environment: worker-candidate
    timeout-minutes: 15
    outputs:
      artifact_sha256: ${{ steps.upload.outputs.artifact_sha256 }}
      candidate_asset_paths: ${{ steps.upload.outputs.candidate_asset_paths }}
      previous_version_id: ${{ steps.baseline.outputs.previous_version_id }}
      source_run_attempt: ${{ steps.upload.outputs.source_run_attempt }}
      version_id: ${{ steps.upload.outputs.version_id }}
    env:
      SOURCE_BRANCH: main
      SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Download the exact CI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: worker-dist
          path: candidate
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify artifact provenance and checksum
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          sha256sum --check worker-dist.sha256
          jq -e \
            --arg artifact_sha256 "$(cut -d ' ' -f 1 worker-dist.sha256)" \
            --arg branch "$SOURCE_BRANCH" \
            --arg commit "$SOURCE_COMMIT" \
            --arg run_id "$SOURCE_RUN_ID" \
            '.production_release_eligible == true and
             (.artifact_contract == "astro-cloudflare-v6" or
              .artifact_contract == "astro-cloudflare-v7") and
             .artifact_sha256 == $artifact_sha256 and
             .build_commit == $commit and
             .event_name == "push" and
             .source_branch == $branch and
             .source_commit == $commit and
             .run_id == $run_id' \
            worker-manifest.json > /dev/null

      - name: Reject unsafe Worker artifact
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          tar -tzf worker-dist.tar.gz > "$RUNNER_TEMP/archive-paths.txt"
          if grep -Eq '(^/|(^|/)\.\.(/|$))' "$RUNNER_TEMP/archive-paths.txt"; then
            echo "Worker archive contains an unsafe path." >&2
            exit 1
          fi
          tar -tvzf worker-dist.tar.gz > "$RUNNER_TEMP/archive-members.txt"
          while read -r mode _; do
            case "${mode:0:1}" in
              -|d) ;;
              *)
                echo "Worker archive contains a link or special file." >&2
                exit 1
                ;;
            esac
          done < "$RUNNER_TEMP/archive-members.txt"
          grep -Fx "dist/server/wrangler.json" "$RUNNER_TEMP/archive-paths.txt"
          grep -Fx "dist/server/entry.mjs" "$RUNNER_TEMP/archive-paths.txt"
          grep -Fx ".wrangler/deploy/config.json" "$RUNNER_TEMP/archive-paths.txt"

      - name: Prepare trusted production configuration
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          tar -xzf worker-dist.tar.gz
          test "$(
            sha256sum dist/server/wrangler.json | cut -d ' ' -f 1
          )" = "$(jq -r .generated_config_sha256 worker-manifest.json)"
          test "$(
            sha256sum .wrangler/deploy/config.json | cut -d ' ' -f 1
          )" = "$(jq -r .deploy_config_sha256 worker-manifest.json)"
          jq -e '
            .name == "zenml-io-v2-worker" and
            .main == "entry.mjs" and
            .compatibility_date == "2026-02-10" and
            .compatibility_flags == ["nodejs_compat", "disable_nodejs_process_v2"] and
            .rules == [{"type":"ESModule","globs":["**/*.js","**/*.mjs"]}] and
            .workers_dev == false and
            .preview_urls == false and
            .no_bundle == true and
            .assets.directory == "../client" and
            .assets.binding == "ASSETS" and
            .assets.html_handling == "drop-trailing-slash" and
            .assets.not_found_handling == "404-page" and
            .assets.run_worker_first == ["/api/*"] and
            (.route == null) and
            (.routes == null) and
            (.build == null) and
            (.durable_objects.bindings // [] | length) == 0 and
            (.kv_namespaces // [] | length) == 0 and
            (.d1_databases // [] | length) == 0 and
            (.r2_buckets // [] | length) == 0 and
            (.services // [] | length) == 0
          ' dist/server/wrangler.json > /dev/null
          jq '{
            name,
            main,
            compatibility_date,
            compatibility_flags,
            rules,
            assets,
            workers_dev: false,
            preview_urls: false,
            no_bundle
          }
          ' dist/server/wrangler.json > dist/server/upload-wrangler.json

      - name: Verify required production secrets
        shell: bash
        env:
          SEGMENT_FORMS_WRITE_KEY: ${{ secrets.SEGMENT_FORMS_WRITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SEGMENT_FORMS_WRITE_KEY" ] || [ -z "$TURNSTILE_SECRET_KEY" ]; then
            echo "Required Worker production secrets are not configured." >&2
            exit 1
          fi

      - name: Install pinned Wrangler
        run: npm install --global wrangler@4.110.0

      - name: Capture accepted production baseline
        id: baseline
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_PRODUCTION_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          worker_name="$WORKER_NAME"
          api_base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth_header="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          wrangler deployments list \
            --name "$worker_name" \
            --json > "$RUNNER_TEMP/deployments-before-upload.json"
          previous_version_id="$(
            jq -er '
              max_by(.created_on) as $latest |
              select(($latest.versions | length) == 1) |
              select($latest.versions[0].percentage == 100) |
              $latest.versions[0].version_id
            ' "$RUNNER_TEMP/deployments-before-upload.json"
          )"
          [[ "$previous_version_id" =~ ^[0-9a-f-]{36}$ ]]

          wrangler versions view "$previous_version_id" \
            --name "$worker_name" \
            --json > "$RUNNER_TEMP/previous-version-metadata.json"
          jq -e '
            .annotations["workers/tag"] == "automatic-main-release" and
            (.annotations["workers/message"] | test(
              "^source_commit=[0-9a-f]{40} source_branch=main source_run_id=[1-9][0-9]* source_run_attempt=[1-9][0-9]* artifact_sha256=[0-9a-f]{64}$"
            )) and
            ([.resources.bindings[]? |
              select(.type == "secret_text") | .name] | sort) ==
            (["SEGMENT_FORMS_WRITE_KEY", "TURNSTILE_SECRET_KEY"] | sort)
          ' "$RUNNER_TEMP/previous-version-metadata.json" > /dev/null
          read -r previous_source_commit previous_source_run_id \
            previous_source_run_attempt < <(
            jq -r '
              .annotations["workers/message"] |
              capture(
                "^source_commit=(?<commit>[0-9a-f]{40}) source_branch=main source_run_id=(?<run_id>[1-9][0-9]*) source_run_attempt=(?<run_attempt>[1-9][0-9]*) "
              ) |
              [.commit, .run_id, .run_attempt] | @tsv
            ' "$RUNNER_TEMP/previous-version-metadata.json"
          )
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$previous_source_run_id/attempts/$previous_source_run_attempt" \
            > "$RUNNER_TEMP/previous-source-run.json"
          jq -e \
            --arg commit "$previous_source_commit" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_attempt "$previous_source_run_attempt" '
            .name == "Website CI and Worker Artifact" and
            .path == ".github/workflows/deploy.yml" and
            .conclusion == "success" and
            .event == "push" and
            .head_branch == "main" and
            .head_repository.full_name == $repository and
            .head_sha == $commit and
            .run_attempt == ($run_attempt | tonumber)
          ' "$RUNNER_TEMP/previous-source-run.json" > /dev/null
          echo "previous_version_id=$previous_version_id" >> "$GITHUB_OUTPUT"

          curl \
            --connect-timeout 10 \
            --max-time 30 \
            --fail-with-body \
            --silent \
            --show-error \
            --header "$auth_header" \
            "$api_base/workers/scripts/$worker_name/subdomain" \
            > "$RUNNER_TEMP/worker-subdomain-before-upload.json"
          jq -e '
            .success == true and
            .result.enabled == false and .result.previews_enabled == false
          ' "$RUNNER_TEMP/worker-subdomain-before-upload.json" > /dev/null

          curl \
            --connect-timeout 10 \
            --max-time 30 \
            --fail-with-body \
            --silent \
            --show-error \
            --header "$auth_header" \
            "$api_base/workers/scripts" \
            > "$RUNNER_TEMP/workers-before-upload.json"
          if ! jq -e \
            --arg worker "$worker_name" \
            --argjson accepted_routes "$ACCEPTED_WORKER_ROUTES_JSON" '
            .success == true and
            ([.result[] | select(.id == $worker)]) as $workers |
            ($workers | length) == 1 and
            ($workers[0].routes | type) == "array" and
            all(
              $workers[0].routes[];
              (type == "string") or
              (
                type == "object" and
                .script == $worker and
                (.pattern | type) == "string"
              )
            ) and
            ([
              $workers[0].routes[] |
              if type == "object" then .pattern else . end
            ] | sort) == ($accepted_routes | sort)
          ' "$RUNNER_TEMP/workers-before-upload.json" > /dev/null; then
            echo "Unexpected Worker route topology before upload." >&2
            exit 1
          fi

          curl \
            --connect-timeout 10 \
            --max-time 30 \
            --fail-with-body \
            --silent \
            --show-error \
            --header "$auth_header" \
            "$api_base/workers/domains?service=$worker_name&per_page=100" \
            > "$RUNNER_TEMP/worker-domains-before-upload.json"
          jq -e --arg worker "$worker_name" '
            .success == true and
            (.result | type) == "array" and
            ([.result[] | select(.service == $worker)] | length == 0) and
            .result_info.total_count == 0
          ' "$RUNNER_TEMP/worker-domains-before-upload.json" > /dev/null

      - name: Upload inactive production version
        id: upload
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_PRODUCTION_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_VERSION_ID: ${{ steps.baseline.outputs.previous_version_id }}
          SEGMENT_FORMS_WRITE_KEY: ${{ secrets.SEGMENT_FORMS_WRITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          set -euo pipefail
          cd candidate

          secrets_file="$RUNNER_TEMP/worker-production-secrets.env"
          output_file="$RUNNER_TEMP/wrangler-release-output.jsonl"
          trap 'rm -f "$secrets_file"' EXIT
          {
            printf 'SEGMENT_FORMS_WRITE_KEY=%s\n' "$SEGMENT_FORMS_WRITE_KEY"
            printf 'TURNSTILE_SECRET_KEY=%s\n' "$TURNSTILE_SECRET_KEY"
          } > "$secrets_file"
          chmod 600 "$secrets_file"

          export WRANGLER_OUTPUT_FILE_PATH="$output_file"
          artifact_sha256="$(jq -r .artifact_sha256 worker-manifest.json)"
          source_run_attempt="$(
            jq -er '
              .run_attempt |
              select(type == "string" and test("^[1-9][0-9]*$"))
            ' worker-manifest.json
          )"
          release_marker="worker-release-marker:$SOURCE_COMMIT:$SOURCE_RUN_ID:$source_run_attempt"
          grep -Fq -- "$release_marker" dist/client/index.html
          grep -Eo '/_astro/[A-Za-z0-9._-]+' dist/client/index.html \
            | LC_ALL=C sort -u \
            | sed -n '1,6p' \
            > "$RUNNER_TEMP/candidate-asset-paths.txt"
          test -s "$RUNNER_TEMP/candidate-asset-paths.txt"
          while IFS= read -r asset_path; do
            test -f "dist/client$asset_path"
          done < "$RUNNER_TEMP/candidate-asset-paths.txt"
          candidate_asset_paths="$(
            jq -R -s -c \
              'split("\n") | map(select(length > 0))' \
              "$RUNNER_TEMP/candidate-asset-paths.txt"
          )"
          jq -e '
            type == "array" and
            length >= 1 and
            length <= 6 and
            all(.[]; test("^/_astro/[A-Za-z0-9._-]+$"))
          ' <<< "$candidate_asset_paths" > /dev/null
          version_message="source_commit=$SOURCE_COMMIT source_branch=$SOURCE_BRANCH source_run_id=$SOURCE_RUN_ID source_run_attempt=$source_run_attempt artifact_sha256=$artifact_sha256"
          wrangler versions upload \
            --config dist/server/upload-wrangler.json \
            --secrets-file "$secrets_file" \
            --strict \
            --dry-run \
            --outdir "$RUNNER_TEMP/release-upload-dry-run"

          live_main_commit="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha
          )"
          if [ "$live_main_commit" != "$SOURCE_COMMIT" ]; then
            echo "Main advanced before the Worker version upload." >&2
            exit 1
          fi

          wrangler versions upload \
            --config dist/server/upload-wrangler.json \
            --secrets-file "$secrets_file" \
            --strict \
            --tag automatic-main-release \
            --message "$version_message"

          jq -s 'map(select(.type == "version-upload")) | last' \
            "$output_file" > upload-result.json
          version_id="$(jq -er .version_id upload-result.json)"
          {
            echo "artifact_sha256=$artifact_sha256"
            echo "candidate_asset_paths=$candidate_asset_paths"
            echo "source_run_attempt=$source_run_attempt"
            echo "version_id=$version_id"
          } >> "$GITHUB_OUTPUT"
          jq -n \
            --arg artifact_sha256 "$artifact_sha256" \
            --argjson candidate_asset_paths "$candidate_asset_paths" \
            --arg previous_version_id "$PREVIOUS_VERSION_ID" \
            --arg source_run_attempt "$source_run_attempt" \
            --arg version_id "$version_id" \
            '{
              artifact_sha256: $artifact_sha256,
              candidate_asset_paths: $candidate_asset_paths,
              previous_version_id: $previous_version_id,
              source_run_attempt: $source_run_attempt,
              version_id: $version_id
            }' > candidate-identity.json

          wrangler versions view "$version_id" \
            --name "$WORKER_NAME" \
            --json > version-metadata.json
          jq -e '
            [.resources.bindings[]? |
              select(.type == "secret_text") | .name] as $names |
            ($names | index("TURNSTILE_SECRET_KEY") != null) and
            ($names | index("SEGMENT_FORMS_WRITE_KEY") != null)
          ' version-metadata.json > /dev/null

          message="$(jq -er '.annotations["workers/message"]' version-metadata.json)"
          grep -Fq -- " source_commit=$SOURCE_COMMIT " <<< " $message "
          grep -Fq -- " source_branch=$SOURCE_BRANCH " <<< " $message "
          grep -Fq -- " source_run_id=$SOURCE_RUN_ID " <<< " $message "
          grep -Fq -- " source_run_attempt=$source_run_attempt " <<< " $message "
          grep -Fq -- " artifact_sha256=$artifact_sha256 " <<< " $message "

      - name: Verify inactive upload preserved production
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_PRODUCTION_TOKEN }}
        run: |
          set -euo pipefail
          worker_name="$WORKER_NAME"
          api_base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth_header="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          wrangler deployments list \
            --name "$worker_name" \
            --json > "$RUNNER_TEMP/deployments-after-upload.json"
          jq -S . "$RUNNER_TEMP/deployments-before-upload.json" \
            > "$RUNNER_TEMP/deployments-before-upload.canonical.json"
          jq -S . "$RUNNER_TEMP/deployments-after-upload.json" \
            > "$RUNNER_TEMP/deployments-after-upload.canonical.json"
          cmp \
            "$RUNNER_TEMP/deployments-before-upload.canonical.json" \
            "$RUNNER_TEMP/deployments-after-upload.canonical.json" || {
              echo "Inactive upload changed the active production deployment." >&2
              exit 1
            }

          curl \
            --connect-timeout 10 \
            --max-time 30 \
            --fail-with-body \
            --silent \
            --show-error \
            --header "$auth_header" \
            "$api_base/workers/scripts/$worker_name/subdomain" \
            > "$RUNNER_TEMP/worker-subdomain-after-upload.json"
          jq -e '
            .success == true and
            .result.enabled == false and .result.previews_enabled == false
          ' "$RUNNER_TEMP/worker-subdomain-after-upload.json" > /dev/null

          curl \
            --connect-timeout 10 \
            --max-time 30 \
            --fail-with-body \
            --silent \
            --show-error \
            --header "$auth_header" \
            "$api_base/workers/scripts" \
            > "$RUNNER_TEMP/workers-after-upload.json"
          if ! jq -e \
            --arg worker "$worker_name" \
            --argjson accepted_routes "$ACCEPTED_WORKER_ROUTES_JSON" '
            .success == true and
            ([.result[] | select(.id == $worker)]) as $workers |
            ($workers | length) == 1 and
            ($workers[0].routes | type) == "array" and
            all(
              $workers[0].routes[];
              (type == "string") or
              (
                type == "object" and
                .script == $worker and
                (.pattern | type) == "string"
              )
            ) and
            ([
              $workers[0].routes[] |
              if type == "object" then .pattern else . end
            ] | sort) == ($accepted_routes | sort)
          ' "$RUNNER_TEMP/workers-after-upload.json" > /dev/null; then
            echo "Unexpected Worker route topology after upload." >&2
            exit 1
          fi

      - name: Preserve upload evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automatic-worker-upload-${{ github.event.workflow_run.id }}
          path: |
            candidate/candidate-identity.json
            candidate/upload-result.json
            candidate/version-metadata.json
            ${{ runner.temp }}/deployments-before-upload.json
            ${{ runner.temp }}/deployments-after-upload.json
            ${{ runner.temp }}/worker-subdomain-before-upload.json
            ${{ runner.temp }}/worker-subdomain-after-upload.json
            ${{ runner.temp }}/workers-before-upload.json
            ${{ runner.temp }}/workers-after-upload.json
            ${{ runner.temp }}/worker-domains-before-upload.json
          if-no-files-found: warn
          retention-days: 30

  activate:
    name: Activate and verify exact production version
    needs: upload
    if: needs.upload.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      ARTIFACT_SHA256: ${{ needs.upload.outputs.artifact_sha256 }}
      CANDIDATE_ASSET_PATHS_JSON: ${{ needs.upload.outputs.candidate_asset_paths }}
      CANDIDATE_VERSION_ID: ${{ needs.upload.outputs.version_id }}
      PREVIOUS_VERSION_ID: ${{ needs.upload.outputs.previous_version_id }}
      SOURCE_BRANCH: main
      SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_ATTEMPT: ${{ needs.upload.outputs.source_run_attempt }}
    steps:
      - name: Install pinned Wrangler
        run: npm install --global wrangler@4.110.0

      - name: Reverify exact candidate and production baseline
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_PRODUCTION_TOKEN }}
        run: |
          set -euo pipefail
          worker_name="$WORKER_NAME"
          api_base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth_header="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          [[ "$CANDIDATE_VERSION_ID" =~ ^[0-9a-f-]{36}$ ]]
          [[ "$PREVIOUS_VERSION_ID" =~ ^[0-9a-f-]{36}$ ]]
          [[ "$ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]

          wrangler versions view "$CANDIDATE_VERSION_ID" \
            --name "$worker_name" \
            --json > "$RUNNER_TEMP/candidate-version.json"
          jq -e '
            [.resources.bindings[]? |
              select(.type == "secret_text") | .name] as $names |
            ($names | index("TURNSTILE_SECRET_KEY") != null) and
            ($names | index("SEGMENT_FORMS_WRITE_KEY") != null)
          ' "$RUNNER_TEMP/candidate-version.json" > /dev/null
          message="$(
            jq -er '.annotations["workers/message"]' \
              "$RUNNER_TEMP/candidate-version.json"
          )"
          grep -Fq -- " source_commit=$SOURCE_COMMIT " <<< " $message "
          grep -Fq -- " source_branch=$SOURCE_BRANCH " <<< " $message "
          grep -Fq -- " source_run_id=$SOURCE_RUN_ID " <<< " $message "
          grep -Fq -- " source_run_attempt=$SOURCE_RUN_ATTEMPT " <<< " $message "
          grep -Fq -- " artifact_sha256=$ARTIFACT_SHA256 " <<< " $message "

          timeout 60s wrangler deployments list \
            --name "$worker_name" \
            --json > "$RUNNER_TEMP/deployments-before-activation.json"
          jq -e --arg previous "$PREVIOUS_VERSION_ID" '
            max_by(.created_on) as $latest |
            ($latest.versions | length) == 1 and
            $latest.versions[0].version_id == $previous and
            $latest.versions[0].percentage == 100
          ' "$RUNNER_TEMP/deployments-before-activation.json" > /dev/null

          curl \
            --connect-timeout 10 \
            --max-time 30 \
            --fail-with-body \
            --silent \
            --show-error \
            --header "$auth_header" \
            "$api_base/workers/scripts/$worker_name/subdomain" \
            > "$RUNNER_TEMP/worker-subdomain-before-activation.json"
          jq -e '
            .success == true and
            .result.enabled == false and .result.previews_enabled == false
          ' "$RUNNER_TEMP/worker-subdomain-before-activation.json" > /dev/null

          curl \
            --connect-timeout 10 \
            --max-time 30 \
            --fail-with-body \
            --silent \
            --show-error \
            --header "$auth_header" \
            "$api_base/workers/scripts" \
            > "$RUNNER_TEMP/workers-before-activation.json"
          if ! jq -e \
            --arg worker "$worker_name" \
            --argjson accepted_routes "$ACCEPTED_WORKER_ROUTES_JSON" '
            .success == true and
            ([.result[] | select(.id == $worker)]) as $workers |
            ($workers | length) == 1 and
            ($workers[0].routes | type) == "array" and
            all(
              $workers[0].routes[];
              (type == "string") or
              (
                type == "object" and
                .script == $worker and
                (.pattern | type) == "string"
              )
            ) and
            ([
              $workers[0].routes[] |
              if type == "object" then .pattern else . end
            ] | sort) == ($accepted_routes | sort)
          ' "$RUNNER_TEMP/workers-before-activation.json" > /dev/null; then
            echo "Unexpected Worker route topology before activation." >&2
            exit 1
          fi

          curl \
            --connect-timeout 10 \
            --max-time 30 \
            --fail-with-body \
            --silent \
            --show-error \
            --header "$auth_header" \
            "$api_base/workers/domains?service=$worker_name&per_page=100" \
            > "$RUNNER_TEMP/worker-domains-before-activation.json"
          jq -e --arg worker "$worker_name" '
            .success == true and
            (.result | type) == "array" and
            ([.result[] | select(.service == $worker)] | length == 0) and
            .result_info.total_count == 0
          ' "$RUNNER_TEMP/worker-domains-before-activation.json" > /dev/null

      - name: Activate, smoke-test, and roll back on failure
        id: release
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_PRODUCTION_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          worker_name="$WORKER_NAME"
          api_base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth_header="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          activation_attempted=false

          active_version() {
            local output_file="$1"
            local max_attempts="${2:-3}"
            local observed_version
            for attempt in 1 2 3; do
              if [ "$attempt" -gt "$max_attempts" ]; then
                break
              fi
              if timeout 60s wrangler deployments list \
                --name "$worker_name" \
                --json > "$output_file" &&
                observed_version="$(
                  jq -r '
                    max_by(.created_on) as $latest |
                    if
                      ($latest.versions | type) == "array" and
                      ($latest.versions | length) == 1 and
                      $latest.versions[0].percentage == 100 and
                      ($latest.versions[0].version_id | type) == "string"
                    then $latest.versions[0].version_id
                    else empty
                    end
                  ' "$output_file"
                )"; then
                printf '%s\n' "$observed_version"
                return 0
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                sleep $((attempt * 2))
              fi
            done
            return 1
          }

          deployment_state() {
            local output_file="$1"
            local max_attempts="${2:-3}"
            local observed_state
            for ((attempt = 1; attempt <= max_attempts; attempt++)); do
              if timeout 60s wrangler deployments list \
                --name "$worker_name" \
                --json > "$output_file" &&
                observed_state="$(
                  jq -r \
                    --arg previous "$PREVIOUS_VERSION_ID" \
                    --arg candidate "$CANDIDATE_VERSION_ID" '
                    max_by(.created_on).versions as $versions |
                    if
                      ($versions | length) == 1 and
                      $versions[0].version_id == $previous and
                      $versions[0].percentage == 100
                    then "previous"
                    elif
                      ($versions | length) == 1 and
                      $versions[0].version_id == $candidate and
                      $versions[0].percentage == 100
                    then "candidate"
                    elif
                      ($versions | length) == 2 and
                      ([
                        $versions[] |
                        select(
                          .version_id == $previous and .percentage == 100
                        )
                      ] | length) == 1 and
                      ([
                        $versions[] |
                        select(
                          .version_id == $candidate and .percentage == 0
                        )
                      ] | length) == 1
                    then "preflight"
                    else "unknown"
                    end
                  ' "$output_file"
                )"; then
                printf '%s\n' "$observed_state"
                return 0
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                sleep $((attempt * 2))
              fi
            done
            return 1
          }

          verify_deployment() {
            local expected_version="$1"
            local output_file="$2"
            local current_version=""
            local observed_state=false
            for attempt in 1 2 3; do
              if current_version="$(active_version "$output_file" 1)"; then
                observed_state=true
                if [ "$current_version" = "$expected_version" ]; then
                  return 0
                fi
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 2))
              fi
            done
            if [ "$observed_state" = true ]; then
              echo "Active version did not converge to the expected exact version." >&2
            else
              echo "Could not read the active production version after 3 attempts." >&2
            fi
            return 1
          }

          verify_preflight_deployment() {
            local output_file="$1"
            local current_state=""
            for attempt in 1 2 3; do
              if current_state="$(deployment_state "$output_file" 1)" &&
                [ "$current_state" = "preflight" ]; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 2))
              fi
            done
            echo "The zero-traffic candidate deployment did not converge." >&2
            return 1
          }

          expect_status() {
            local expected="$1"
            local url="$2"
            local label="$3"
            local version_override="${4:-}"
            local max_attempts="${5:-3}"
            local retry_delay="${6:-2}"
            local actual
            local request_url
            local -a curl_args
            for ((attempt=1; attempt<=max_attempts; attempt++)); do
              request_url="$url"
              curl_args=(
                --connect-timeout 10
                --max-time 15
                --silent
                --show-error
                --output "$RUNNER_TEMP/smoke-${label}.body"
                --write-out "%{http_code}"
              )
              if [ -n "$version_override" ]; then
                curl_args+=(
                  --header
                  "Cloudflare-Workers-Version-Overrides: $worker_name=\"$version_override\""
                )
                if [[ "$request_url" == *"?"* ]]; then
                  request_url="${request_url}&__worker_smoke=${GITHUB_RUN_ID}-${attempt}"
                else
                  request_url="${request_url}?__worker_smoke=${GITHUB_RUN_ID}-${attempt}"
                fi
              fi
              actual="$(curl "${curl_args[@]}" "$request_url")" || actual="000"
              if [ "$actual" = "$expected" ]; then
                return 0
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                sleep "$retry_delay"
              fi
            done
            printf '%s expected HTTP %s, received %s after %s attempts.\n' \
              "$url" "$expected" "$actual" "$max_attempts" >&2
            return 1
          }

          expect_candidate_home() {
            local version_override="${1-$CANDIDATE_VERSION_ID}"
            local phase="${2:-preflight}"
            local label="${3:-preflight-home}"
            local expected_marker="worker-release-marker:$SOURCE_COMMIT:$SOURCE_RUN_ID:$SOURCE_RUN_ATTEMPT"
            local attempt
            for attempt in $(seq 1 12); do
              if expect_status 200 \
                "https://www.zenml.io/?__worker_${phase}_marker_attempt=$attempt" \
                "$label" "$version_override" 1 0 &&
                grep -Fq -- "$expected_marker" \
                  "$RUNNER_TEMP/smoke-${label}.body"; then
                return 0
              fi
              if [ "$attempt" -lt 12 ]; then
                sleep 5
              fi
            done
            echo "The ${phase} homepage did not converge to the candidate release marker." >&2
            return 1
          }

          expect_candidate_assets() {
            local version_override="${1-$CANDIDATE_VERSION_ID}"
            local phase="${2:-preflight}"
            local attempt
            local asset_index
            local asset_path
            local actual
            local -a curl_args
            local -a pids

            jq -e '
              type == "array" and
              length >= 1 and
              length <= 6 and
              all(.[]; test("^/_astro/[A-Za-z0-9._-]+$"))
            ' <<< "$CANDIDATE_ASSET_PATHS_JSON" > /dev/null
            jq -er '.[]' <<< "$CANDIDATE_ASSET_PATHS_JSON" \
              > "$RUNNER_TEMP/candidate-asset-paths.txt"

            for attempt in $(seq 1 12); do
              asset_index=0
              pids=()
              while IFS= read -r asset_path; do
                (
                  curl_args=(
                    --connect-timeout 10
                    --max-time 15
                    --silent
                    --show-error
                    --output "$RUNNER_TEMP/${phase}-candidate-asset-${attempt}-${asset_index}.body"
                    --write-out "%{http_code}"
                  )
                  if [ -n "$version_override" ]; then
                    curl_args+=(
                      --header
                      "Cloudflare-Workers-Version-Overrides: $worker_name=\"$version_override\""
                    )
                  fi
                  actual="$(
                    curl "${curl_args[@]}" \
                      "https://www.zenml.io${asset_path}?__worker_${phase}_candidate_asset=${GITHUB_RUN_ID}-${attempt}-${asset_index}"
                  )" || actual="000"
                  printf '%s\t%s\n' "$asset_path" "$actual" \
                    > "$RUNNER_TEMP/${phase}-candidate-asset-${attempt}-${asset_index}.status"
                ) &
                pids+=("$!")
                asset_index=$((asset_index + 1))
              done < "$RUNNER_TEMP/candidate-asset-paths.txt"
              test "$asset_index" -ge 1
              for pid in "${pids[@]}"; do
                wait "$pid"
              done
              if awk -F '\t' '$2 != "200" { failed = 1 } END { exit failed }' \
                "$RUNNER_TEMP"/"$phase"-candidate-asset-"$attempt"-*.status; then
                return 0
              fi
              if [ "$attempt" -lt 12 ]; then
                sleep 5
              fi
            done
            echo "The ${phase} candidate assets did not converge." >&2
            return 1
          }

          rollback_previous_version() {
            local original_status=$?
            trap - ERR
            set +e
            if [ "$activation_attempted" = true ]; then
              echo "Post-activation verification failed; reconciling the active version before rollback." >&2
              rollback_deploy_status=1
              rollback_verify_status=1
              for attempt in 1 2 3; do
                if ! current_state="$(
                  deployment_state \
                    "$RUNNER_TEMP/deployments-before-inline-rollback.json"
                )"; then
                  echo "Could not read the production deployment from the Cloudflare control plane; inline rollback will not act." >&2
                  exit "$original_status"
                fi
                if [ "$current_state" = "previous" ]; then
                  echo "Previous production version is already active." >&2
                  rollback_deploy_status=0
                  rollback_verify_status=0
                  break
                fi
                if [ "$current_state" = "preflight" ]; then
                  echo "Previous production version is serving 100 percent with the candidate held at 0 percent." >&2
                elif [ "$current_state" != "candidate" ]; then
                  echo "An unknown production version is active; inline rollback will not replace it." >&2
                  exit "$original_status"
                fi

                if timeout 90s \
                  wrangler versions deploy "$PREVIOUS_VERSION_ID@100%" \
                    --name "$worker_name" \
                    --yes; then
                  rollback_deploy_status=0
                  if ! current_state="$(
                    deployment_state \
                      "$RUNNER_TEMP/deployments-after-rollback.json"
                  )"; then
                    echo "Could not read the production deployment from the Cloudflare control plane after rollback; inline rollback will not retry." >&2
                    exit "$original_status"
                  fi
                  if [ "$current_state" = "previous" ]; then
                    rollback_verify_status=0
                    break
                  fi
                  if [ "$current_state" != "candidate" ] &&
                    [ "$current_state" != "preflight" ]; then
                    echo "An unknown production version is active; inline rollback will not replace it." >&2
                    exit "$original_status"
                  fi
                  echo "Rollback deploy did not converge; the candidate remains active." >&2
                fi
                if [ "$attempt" -lt 3 ]; then
                  sleep $((attempt * 2))
                fi
              done
              rollback_http_status="$(
                curl \
                  --connect-timeout 10 \
                  --max-time 30 \
                  --silent \
                  --show-error \
                  --output "$RUNNER_TEMP/smoke-rollback-home.body" \
                  --write-out "%{http_code}" \
                  "https://www.zenml.io/"
              )"
              if [ "$rollback_http_status" != "200" ]; then
                rollback_verify_status=1
              fi
              if [ "$rollback_deploy_status" -eq 0 ] && [ "$rollback_verify_status" -eq 0 ]; then
                echo "Automatic rollback completed." >&2
              else
                echo "Rollback verification failed; immediate operator action is required." >&2
              fi
            fi
            exit "$original_status"
          }
          trap rollback_previous_version ERR

          live_main_commit="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha
          )"
          if [ "$live_main_commit" != "$SOURCE_COMMIT" ]; then
            echo "Main advanced while the release waited for protected environments." >&2
            exit 1
          fi

          if ! current_version="$(
            active_version \
              "$RUNNER_TEMP/deployments-immediately-before-activation.json"
          )"; then
            echo "Could not read the production baseline immediately before activation." >&2
            exit 1
          fi
          if [ "$current_version" != "$PREVIOUS_VERSION_ID" ]; then
            echo "Production baseline changed before activation; refusing to overwrite it." >&2
            exit 1
          fi

          activation_attempted=true
          timeout 90s \
            wrangler versions deploy "$PREVIOUS_VERSION_ID@100%" "$CANDIDATE_VERSION_ID@0%" \
              --name "$worker_name" \
              --yes
          verify_preflight_deployment \
            "$RUNNER_TEMP/deployments-after-preflight.json"

          expect_candidate_home "$CANDIDATE_VERSION_ID" preflight preflight-home
          expect_candidate_assets "$CANDIDATE_VERSION_ID" preflight
          verify_preflight_deployment \
            "$RUNNER_TEMP/deployments-immediately-before-promotion.json"

          timeout 90s \
            wrangler versions deploy "$CANDIDATE_VERSION_ID@100%" \
              --name "$worker_name" \
              --yes
          verify_deployment \
            "$CANDIDATE_VERSION_ID" \
            "$RUNNER_TEMP/deployments-after-activation.json"

          curl \
            --connect-timeout 10 \
            --max-time 30 \
            --fail-with-body \
            --silent \
            --show-error \
            --header "$auth_header" \
            "$api_base/workers/scripts" \
            > "$RUNNER_TEMP/workers-after-activation.json"
          if ! jq -e \
            --arg worker "$worker_name" \
            --argjson accepted_routes "$ACCEPTED_WORKER_ROUTES_JSON" '
            .success == true and
            ([.result[] | select(.id == $worker)]) as $workers |
            ($workers | length) == 1 and
            ($workers[0].routes | type) == "array" and
            all(
              $workers[0].routes[];
              (type == "string") or
              (
                type == "object" and
                .script == $worker and
                (.pattern | type) == "string"
              )
            ) and
            ([
              $workers[0].routes[] |
              if type == "object" then .pattern else . end
            ] | sort) == ($accepted_routes | sort)
          ' "$RUNNER_TEMP/workers-after-activation.json" > /dev/null; then
            echo "Unexpected Worker route topology after activation." >&2
            false
          fi

          expect_candidate_home "" active home
          expect_status 200 "https://www.zenml.io/blog" blog
          expect_status 200 "https://www.zenml.io/product/kitaru" kitaru
          expect_status 200 "https://www.zenml.io/pricing" pricing
          expect_status 200 \
            "https://www.zenml.io/blog/dagster-alternatives" dagster
          expect_status 200 \
            "https://www.zenml.io/api/github-stars" github-stars
          expect_status 405 \
            "https://www.zenml.io/api/forms/demo-request" forms-get
          expect_status 301 "https://www.zenml.io/sitemap.xml" sitemap
          expect_status 404 \
            "https://www.zenml.io/__automatic-worker-release-smoke-missing" missing
          grep -Eo '/_astro/[^" ]+' "$RUNNER_TEMP/smoke-home.body" \
            | sort -u \
            | sed -n '1,6p' \
            > "$RUNNER_TEMP/smoke-assets.txt"
          test -s "$RUNNER_TEMP/smoke-assets.txt"
          cmp "$RUNNER_TEMP/candidate-asset-paths.txt" \
            "$RUNNER_TEMP/smoke-assets.txt"
          expect_candidate_assets "" active

          if ! expect_status 301 "https://zenml.io/" apex; then
            echo "- Apex redirect check: failed (zone-level, non-rollback)" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          verify_deployment \
            "$CANDIDATE_VERSION_ID" \
            "$RUNNER_TEMP/deployments-after-smoke.json"
          trap - ERR
          {
            echo "## Automatic production Worker release"
            echo
            printf -- "- Source commit: \`%s\`\n" "$SOURCE_COMMIT"
            printf -- "- Source CI run: \`%s\`\n" "$SOURCE_RUN_ID"
            printf -- "- Previous version: \`%s\`\n" "$PREVIOUS_VERSION_ID"
            printf -- "- Active version: \`%s\`\n" "$CANDIDATE_VERSION_ID"
            printf -- "- Artifact SHA-256: \`%s\`\n" "$ARTIFACT_SHA256"
            echo "- Production smoke: passed"
            echo "- Zero-traffic exact-version preflight: passed"
            echo "- Worker routes and DNS: unchanged"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve activation and smoke evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automatic-worker-release-${{ github.event.workflow_run.id }}
          path: |
            ${{ runner.temp }}/candidate-version.json
            ${{ runner.temp }}/deployments-before-activation.json
            ${{ runner.temp }}/deployments-immediately-before-activation.json
            ${{ runner.temp }}/deployments-after-preflight.json
            ${{ runner.temp }}/deployments-immediately-before-promotion.json
            ${{ runner.temp }}/deployments-before-inline-rollback.json
            ${{ runner.temp }}/deployments-after-activation.json
            ${{ runner.temp }}/deployments-after-smoke.json
            ${{ runner.temp }}/deployments-after-rollback.json
            ${{ runner.temp }}/worker-subdomain-before-activation.json
            ${{ runner.temp }}/workers-before-activation.json
            ${{ runner.temp }}/workers-after-activation.json
            ${{ runner.temp }}/worker-domains-before-activation.json
            ${{ runner.temp }}/preflight-candidate-asset-*.body
            ${{ runner.temp }}/preflight-candidate-asset-*.status
            ${{ runner.temp }}/active-candidate-asset-*.body
            ${{ runner.temp }}/active-candidate-asset-*.status
            ${{ runner.temp }}/smoke-*.body
            ${{ runner.temp }}/smoke-assets.txt
          if-no-files-found: warn
          retention-days: 30

  recover:
    name: Recover previous production version after failed activation
    needs: [upload, activate]
    if: >-
      always() &&
      needs.upload.result == 'success' &&
      needs.activate.result != 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      CANDIDATE_VERSION_ID: ${{ needs.upload.outputs.version_id }}
      PREVIOUS_VERSION_ID: ${{ needs.upload.outputs.previous_version_id }}
    steps:
      - name: Install pinned Wrangler
        run: npm install --global wrangler@4.110.0

      - name: Reconcile and recover previous version
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_PRODUCTION_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_VERSION_ID" =~ ^[0-9a-f-]{36}$ ]]
          [[ "$PREVIOUS_VERSION_ID" =~ ^[0-9a-f-]{36}$ ]]

          deployment_state() {
            local observed_state
            for attempt in 1 2 3; do
              if timeout 60s wrangler deployments list \
                --name "$WORKER_NAME" \
                --json > "$RUNNER_TEMP/recovery-deployments.json" &&
                observed_state="$(
                  jq -r \
                    --arg previous "$PREVIOUS_VERSION_ID" \
                    --arg candidate "$CANDIDATE_VERSION_ID" '
                    max_by(.created_on).versions as $versions |
                    if
                      ($versions | length) == 1 and
                      $versions[0].version_id == $previous and
                      $versions[0].percentage == 100
                    then "previous"
                    elif
                      ($versions | length) == 1 and
                      $versions[0].version_id == $candidate and
                      $versions[0].percentage == 100
                    then "candidate"
                    elif
                      ($versions | length) == 2 and
                      ([
                        $versions[] |
                        select(
                          .version_id == $previous and .percentage == 100
                        )
                      ] | length) == 1 and
                      ([
                        $versions[] |
                        select(
                          .version_id == $candidate and .percentage == 0
                        )
                      ] | length) == 1
                    then "preflight"
                    else "unknown"
                    end
                  ' "$RUNNER_TEMP/recovery-deployments.json"
                )"; then
                printf '%s\n' "$observed_state"
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 2))
              fi
            done
            return 1
          }

          recovered=false
          for attempt in 1 2 3; do
            if ! current_state="$(deployment_state)"; then
              echo "Could not read the production deployment from the Cloudflare control plane; recovery will not act." >&2
              exit 1
            fi
            if [ "$current_state" = "previous" ]; then
              echo "Previous production version is already active."
              recovered=true
              break
            fi
            if [ "$current_state" = "preflight" ]; then
              echo "Removing the zero-traffic candidate from the production deployment."
            elif [ "$current_state" != "candidate" ]; then
              echo "An unknown production version is active; recovery will not replace it." >&2
              exit 1
            fi

            if timeout 90s \
              wrangler versions deploy "$PREVIOUS_VERSION_ID@100%" \
                --name "$WORKER_NAME" \
                --yes; then
              if ! current_state="$(deployment_state)"; then
                echo "Could not read the production deployment from the Cloudflare control plane after rollback; recovery will not retry." >&2
                exit 1
              fi
              if [ "$current_state" = "previous" ]; then
                recovered=true
                break
              fi
              if [ "$current_state" != "candidate" ] &&
                [ "$current_state" != "preflight" ]; then
                echo "An unknown production version is active; recovery will not replace it." >&2
                exit 1
              fi
              echo "Recovery deploy did not converge; the candidate remains active." >&2
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 2))
            fi
          done
          if [ "$recovered" != true ]; then
            echo "Recovery could not restore the previous Worker version." >&2
            exit 1
          fi

          home_status="000"
          for attempt in 1 2 3; do
            home_status="$(
              curl \
                --connect-timeout 10 \
                --max-time 15 \
                --silent \
                --show-error \
                --output "$RUNNER_TEMP/recovery-home.body" \
                --write-out "%{http_code}" \
                "https://www.zenml.io/"
            )" || home_status="000"
            if [ "$home_status" = "200" ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 2
            fi
          done
          if [ "$home_status" != "200" ]; then
            echo "Previous version is active but the homepage check failed." >&2
            exit 1
          fi

          if ! final_state="$(deployment_state)"; then
            echo "Could not read the production deployment after homepage verification; recovery did not complete." >&2
            exit 1
          fi
          if [ "$final_state" != "previous" ]; then
            echo "Active production version changed during recovery verification; recovery did not complete." >&2
            exit 1
          fi

          echo "Recovered and verified the previous production Worker version."

      - name: Preserve recovery evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automatic-worker-recovery-${{ github.event.workflow_run.id }}
          path: |
            ${{ runner.temp }}/recovery-deployments.json
            ${{ runner.temp }}/recovery-home.body
          if-no-files-found: warn
          retention-days: 30
