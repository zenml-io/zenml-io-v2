---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "07:00"
      timezone: Europe/Amsterdam
    reviewers: [strickvl]
    labels: [dependencies]
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "07:00"
      timezone: Europe/Amsterdam
    reviewers: [strickvl]
    labels: [dependencies]
    groups:
      # Keep Astro core and its integrations together so an integration
      # major (e.g. @astrojs/preact 5) can never land ahead of the matching
      # astro core major. The Astro upgrade must bump astro + all @astrojs/*
      # in a single PR.
      #
      # wrangler is in this group on purpose: @astrojs/cloudflare 14 pulls in
      # @cloudflare/vite-plugin, which asserts `wrangler ^4.110.0` at startup
      # and hard-fails the build if it is not satisfied. wrangler must be able
      # to move in the same PR as the adapter, so it cannot live in
      # minor-and-patch. (This is what broke #136.)
      astro:
        patterns:
          - astro
          - '@astrojs/*'
          - wrangler
      # Biome gets its own group so a formatter change can never hide inside a
      # multi-package PR. Biome ships formatting changes in PATCH releases:
      # 2.5.3 -> 2.5.4 changed how it breaks curried calls like
      # `it.each(...)(...)`, failing `pnpm lint` on already-committed source
      # from inside "Bump the minor-and-patch group with 4 updates" (#165) --
      # a title naming neither the culprit nor that the diff was cosmetic.
      #
      # Alone, the title names the cause. The fix is always:
      #   pnpm lint:fix && git commit -am "Reformat for Biome <version>"
      # Check it is formatting-only with `git diff --ignore-all-space` first.
      biome:
        patterns:
          - '@biomejs/biome'
      minor-and-patch:
        patterns: ['*']
        update-types:
          - minor
          - patch
    # The astro/@astrojs semver-major ignore block that used to sit here was
    # lifted after the Astro 5 -> 7 migration landed (#128, merged in #204).
    # If majors ever need holding again, ignore the WHOLE astro group together,
    # never a single member: ignores apply BEFORE grouping, so ignoring one
    # member silently drops it out of the group PR instead of holding the
    # group back (that mistake produced #136).
    ignore:
      # wrangler 4.114.0-4.118.0 (miniflare/workerd 20260722 snapshot) drop
      # local connections intermittently during `wrangler dev`, failing
      # `check:worker` on most CI runs (PR #207 has the measured rates;
      # tracked upstream at cloudflare/workers-sdk#15002). This ignore drops
      # broken wrangler versions out of the astro group PR while astro and
      # @astrojs/* keep flowing — deliberately, unlike the #136 mistake.
      # Lift criteria and boot-loop verification procedure: issue #216.
      - dependency-name: 'wrangler'
        versions: ['>=4.114.0']
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
