---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "07:00"
      timezone: Europe/Amsterdam
    reviewers: [strickvl]
    labels: [dependencies]
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    # Dependabot's updater runs pnpm 11, which ignores package.json's "pnpm"
    # field — keep overrides in pnpm-workspace.yaml (see pnpm-workspace.yaml).
    schedule:
      interval: weekly
      day: tuesday
      time: "07:00"
      timezone: Europe/Amsterdam
    reviewers: [strickvl]
    labels: [dependencies]
    groups:
      # Keep Astro core and its integrations together so an integration
      # major (e.g. @astrojs/preact 5) can never land ahead of the matching
      # astro core major. The Astro upgrade must bump astro + all @astrojs/*
      # in a single PR.
      #
      # wrangler is in this group on purpose: @astrojs/cloudflare 14 pulls in
      # @cloudflare/vite-plugin, which asserts `wrangler ^4.110.0` at startup
      # and hard-fails the build if it is not satisfied. wrangler must be able
      # to move in the same PR as the adapter, so it cannot live in
      # minor-and-patch. (This is what broke #136.)
      astro:
        patterns:
          - astro
          - '@astrojs/*'
          - wrangler
      # Biome gets its own group so a formatter change can never hide inside a
      # multi-package PR. Biome ships formatting changes in PATCH releases:
      # 2.5.3 -> 2.5.4 changed how it breaks curried calls like
      # `it.each(...)(...)`, failing `pnpm lint` on already-committed source
      # from inside "Bump the minor-and-patch group with 4 updates" (#165) --
      # a title naming neither the culprit nor that the diff was cosmetic.
      #
      # Alone, the title names the cause. The fix is always:
      #   pnpm lint:fix && git commit -am "Reformat for Biome <version>"
      # Check it is formatting-only with `git diff --ignore-all-space` first.
      biome:
        patterns:
          - '@biomejs/biome'
      minor-and-patch:
        patterns: ['*']
        update-types:
          - minor
          - patch
    # The astro/@astrojs semver-major ignore block that used to sit here was
    # lifted after the Astro 5 -> 7 migration landed (#128, merged in #204).
    # If majors ever need holding again, ignore the WHOLE astro group together,
    # never a single member: ignores apply BEFORE grouping, so ignoring one
    # member silently drops it out of the group PR instead of holding the
    # group back (that mistake produced #136).
    ignore:
      # wrangler >=4.114.0 intermittently kills `wrangler dev` mid-request
      # ("Network connection lost" -> process exit -> ECONNREFUSED), failing
      # `check:worker` on most CI runs. Root cause: miniflare 4.20260722.0
      # started auto-restarting workerd behind an `unsafeHandleRuntimeRestart`
      # hook that wrangler never implemented, so it treats the restart as
      # fatal. Still present in 4.127.1 (3/25 local boot-loop failures on
      # 2026-09-01; 4.113.0 = 0/25). Canonical upstream issue:
      # cloudflare/workers-sdk#14926 (our #15002 was closed as its duplicate).
      # This ignore drops broken wrangler versions out of the astro group PR
      # while astro and @astrojs/* keep flowing — deliberately, unlike the
      # #136 mistake. Lift criteria and boot-loop procedure: issue #216.
      - dependency-name: 'wrangler'
        versions: ['>=4.114.0']
      # @types/node majors must match the pinned Node runtime major (22:
      # .nvmrc, engines, deploy.yml). Types for a newer Node let code that
      # uses newer-runtime-only APIs pass typecheck and then crash in CI
      # (#219 closed for this reason). Lift to '>=25.0.0' as part of the
      # Node 24 LTS runtime upgrade: issue #221.
      - dependency-name: '@types/node'
        versions: ['>=23.0.0']
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
