<section class="bg-(--color-cream-50) pt-space-xs pb-space-xl md:pb-space-xxl">
<div class="mx-auto max-w-content px-gutter">
<div id="my-cal-inline-success-calendar" class="h-[700px] w-full overflow-auto">
</div>
<p class="mt-space-sm text-center font-sans text-sm text-muted-foreground">Can't see the calendar?
<a href="https://app.cal.com/zenml/discovery-call" target="_blank" rel="noopener noreferrer" class="text-(--color-sage-800) underline decoration-(--color-sage-500) underline-offset-4 transition-colors hover:text-foreground">Open directly →
</a>
</p>
<script>(function(){const namespace = "discovery-call";
const elementId = "my-cal-inline-success-calendar";
const calLink = "zenml/discovery-call";
const layout = "month_view";
const CAL_EMBED_SCRIPT = "https://app.cal.com/embed/embed.js";
const CAL_ORIGIN = "https://app.cal.com";

  // Cal.com embed IIFE — loads embed.js and registers the namespace
  (function (C, A, L) {
    let p = function (a, ar) { a.q.push(ar); };
    let d = C.document;
    C.Cal = C.Cal || function () {
      let cal = C.Cal;
      let ar = arguments;
      if (!cal.loaded) {
        cal.ns = {};
        cal.q = cal.q || [];
        d.head.appendChild(d.createElement("script")).src = A;
        cal.loaded = true;
      }
      if (ar[0] === L) {
        const api = function () { p(api, arguments); };
        const ns = ar[1];
        api.q = api.q || [];
        if (typeof ns === "string") {
          cal.ns[ns] = cal.ns[ns] || api;
          p(cal.ns[ns], ar);
          p(cal, ["initNamespace", ns]);
        } else {
          p(cal, ar);
        }
        return;
      }
      p(cal, ar);
    };
  })(window, CAL_EMBED_SCRIPT, "init");

  Cal("init", namespace, { origin: CAL_ORIGIN });
  Cal.ns[namespace]("inline", {
    elementOrSelector: "#" + elementId,
    config: { layout: layout },
    calLink: calLink,
  });
  Cal.ns[namespace]("ui", { hideEventTypeDetails: false, layout: layout });

  // Cal.com initially hides its iframe until it receives its ready message.
  // If that message is delayed or lost, preserve the working embedded calendar
  // rather than leaving the page blank. This touches only the iframe's own
  // visibility; its URL, namespace, and booking event listeners stay intact.
  (function () {
    const target = document.getElementById(elementId);
    if (!target) return;

    const reveal = () => {
      const frame = target.querySelector("iframe.cal-embed");
      if (!frame) return false;

      frame.addEventListener(
        "load",
        () => {
          frame.style.visibility = "visible";
        },
        { once: true },
      );

      return true;
    };

    if (!reveal()) {
      const observer = new MutationObserver(() => {
        if (reveal()) observer.disconnect();
      });
      observer.observe(target, { childList: true, subtree: true });
    }

    window.setTimeout(() => {
      const frame = target.querySelector("iframe.cal-embed");
      if (frame) frame.style.visibility = "visible";
    }, 8000);
  })();

  // Plausible tracking listeners (Webflow parity)
  Cal.ns[namespace]("on", {
    action: "bookingSuccessful",
    callback: function (e) {
      if (window.plausible) {
        window.plausible("Cal: Booking Confirmed", {
          props: {
            date: (e && e.detail && e.detail.data && e.detail.data.date) || "",
            duration: (e && e.detail && e.detail.data && e.detail.data.duration) || "",
          },
        });
      }
    },
  });

  Cal.ns[namespace]("on", {
    action: "linkReady",
    callback: function () {
      if (window.plausible) window.plausible("Cal: Embed Loaded");
    },
  });

  Cal.ns[namespace]("on", {
    action: "linkFailed",
    callback: function () {
      if (window.plausible) window.plausible("Cal: Embed Failed");
    },
  });
})();
</script>
</div>
</section>
